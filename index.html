<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EnglishQuest 180 - Aprende Inglés en 6 Meses (Juego Interactivo)</title>

  <!-- Local Standalone CSS (Funciona 100% offline o con conexión bloqueada) -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Tailwind CSS CDN (opcional, si hay internet) -->
  <script src="https://cdn.tailwindcss.com" onerror="console.log('Modo autónomo activado (CSS local en uso)')"></script>

  <!-- Canvas Confetti con fallback integrado -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js" onerror="console.log('Confetti CDN offline, usando fallback')"></script>
  <script>
    if (!window.confetti) {
      window.confetti = function() {
        console.log('🎉 ¡Celebración!');
      };
    }
  </script>
</head>
<body class="text-slate-100 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

  <!-- TOP HEADER / STATS BAR -->
  <header class="sticky top-0 z-40 bg-slate-950/80 backdrop-blur-md border-b border-slate-800/80 px-4 sm:px-8 py-3 transition-colors">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row md:items-center justify-between gap-4">
      
      <!-- Brand & Title -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-indigo-600 flex items-center justify-center text-2xl shadow-lg">
            ⚔️
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-lg font-black tracking-tight text-white">EnglishQuest <span class="text-indigo-400">180</span></h1>
              <span class="px-2 py-0.5 text-[10px] font-extrabold uppercase rounded-full bg-slate-800 text-indigo-300 border border-slate-700">
                6 Meses
              </span>
            </div>
            <p id="user-rank" class="text-xs text-slate-400 font-medium">🌱 Aprendiz Novato (A1)</p>
          </div>
        </div>

        <!-- Mobile Sound Toggle -->
        <button id="audio-toggle" class="md:hidden text-lg p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white" title="Activar/Desactivar Sonido">
          🔊
        </button>
      </div>

      <!-- Gamification Stats Pills -->
      <div class="flex items-center flex-wrap gap-2.5 sm:gap-4">
        <!-- Avatar & Level -->
        <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-800 px-3 py-1.5 rounded-xl">
          <span id="user-avatar" class="text-xl">🌱</span>
          <div class="text-left">
            <span id="user-level" class="text-xs font-black text-indigo-300 block leading-tight">Nivel 1</span>
            <div class="w-16 h-1.5 bg-slate-800 rounded-full mt-1 overflow-hidden">
              <div id="user-xp-bar" class="h-full bg-indigo-500 rounded-full" style="width: 0%"></div>
            </div>
          </div>
          <span id="user-xp-text" class="text-[10px] text-slate-400 font-mono hidden sm:inline">0/50 XP</span>
        </div>

        <!-- Day Streak Pill -->
        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-rose-300 text-xs font-black" title="Racha de Días Consecutivos">
          <span>🔥</span>
          <span id="user-streak">1 día</span>
        </div>

        <!-- Gems Pill -->
        <div class="flex items-center gap-1.5 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl text-amber-300 text-xs font-black" title="LinguaGems para canjear en la tienda">
          <span>💎</span>
          <span id="user-gems">80</span>
        </div>

        <!-- Desktop Sound Toggle -->
        <button id="audio-toggle-desktop" onclick="document.getElementById('audio-toggle').click()" class="hidden md:flex text-base p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white hover:bg-slate-800 transition-all" title="Sonido On/Off">
          🔊
        </button>
      </div>

    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <nav class="bg-slate-950/60 border-b border-slate-800/60 px-4 sm:px-8 py-2 sticky top-[65px] z-30 backdrop-blur-md">
    <div class="max-w-7xl mx-auto flex items-center justify-center sm:justify-start gap-1 sm:gap-2 overflow-x-auto py-1">
      <button class="nav-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all bg-indigo-600 text-white shadow-lg" data-view="roadmap">
        <span>🗺️</span>
        <span>Ruta 6 Meses</span>
      </button>

      <button class="nav-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all text-slate-400 hover:bg-slate-800 hover:text-white" data-view="arena">
        <span>🎙️</span>
        <span>Dojo de Voz</span>
      </button>

      <button class="nav-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all text-slate-400 hover:bg-slate-800 hover:text-white" data-view="shop">
        <span>🛒</span>
        <span>Tienda</span>
      </button>

      <button class="nav-btn px-4 py-2 rounded-xl text-xs sm:text-sm font-bold flex items-center gap-2 transition-all text-slate-400 hover:bg-slate-800 hover:text-white" data-view="profile">
        <span>🏆</span>
        <span>Perfil & Logros</span>
      </button>
    </div>
  </nav>

  <!-- MAIN DYNAMIC CONTENT CONTAINER -->
  <main class="flex-1 px-4 sm:px-8 py-8">
    <div id="view-container">
      <!-- Dynamic views injected via app.js -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-950 border-t border-slate-900 py-6 px-4 text-center text-xs text-slate-500">
    <div class="max-w-4xl mx-auto space-y-2">
      <p class="font-medium text-slate-400">EnglishQuest 180 • Método de Inmersión Activa, Fonética y Repetición Espaciada en 6 Meses</p>
      <p>💡 Tip de oro: Dedica 15 minutos diarios antes de acostarte o al despertar para afianzar la memoria a largo plazo.</p>
    </div>
  </footer>

  <!-- SCRIPT FILES -->
  <script src="js/audio.js"></script>
  <script src="js/speech.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/gamification.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
